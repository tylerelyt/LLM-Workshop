<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="350" viewBox="0 0 1040 350" role="img" aria-labelledby="title desc">
  <title id="title">从模型能力到系统能力</title>
  <desc id="desc">Model 侧理解预训练、表示、后训练和模型接口。Harness 侧学习上下文、知识、推理、工具、状态与反馈。二者共同支持知识问答、结构化查询、工具应用与 Agent。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#94a3b8" stroke-width="1.3"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif} .title{font-size:27px;font-weight:650} .body{font-size:19px;fill:#26364c} .small{font-size:15px;fill:#526176} .label{font-size:18px;font-weight:600;fill:#26364c}</style>
  </defs>
  <rect x="1" y="1" width="1038" height="348" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <rect x="22" y="22" width="420" height="224" rx="12" fill="#f4f7ff" stroke="#d6e1f5"/>
  <rect x="500" y="22" width="518" height="224" rx="12" fill="#f1f8f5" stroke="#d3e7dd"/>
  <text x="46" y="62" class="title" fill="#254db6">Model</text>
  <text x="46" y="91" class="small">模型怎样获得与提供能力</text>
  <path d="M46 108 H418" stroke="#d6e1f5"/>
  <text x="46" y="142" class="body">预训练与表示学习</text>
  <text x="46" y="179" class="body">指令、偏好与任务适配</text>
  <text x="46" y="216" class="body">Token · Completion / Chat · MaaS</text>
  <path d="M456 135 H486" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="524" y="62" class="title" fill="#24654c">Harness</text>
  <text x="524" y="91" class="small">系统怎样组织与使用能力</text>
  <path d="M524 108 H994" stroke="#d3e7dd"/>
  <text x="524" y="140" class="label">上下文与知识</text>
  <text x="524" y="164" class="small">提示 · RAG · 文档 · 图谱</text>
  <text x="778" y="140" class="label">推理与规划</text>
  <text x="778" y="164" class="small">CoT · 自一致性 · 工作流</text>
  <text x="524" y="201" class="label">工具与协议</text>
  <text x="524" y="225" class="small">函数 · MCP · CLI · Skills</text>
  <text x="778" y="201" class="label">状态与反馈</text>
  <text x="778" y="225" class="small">Session · 记忆 · 恢复</text>
  <path d="M232 248 V270" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M759 248 V270" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="22" y="282" width="996" height="46" rx="9" fill="#172b45"/>
  <text x="520" y="311" text-anchor="middle" font-size="19" fill="#fff">知识问答　 ·　 结构化查询　 ·　 工具应用　 ·　 Agent</text>
</svg>
